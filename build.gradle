import net.darkhax.curseforgegradle.TaskPublishCurseForge

plugins {
    id "java"
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'com.github.johnrengelman.shadow' version '8.1.1' // 使用最新版本
    id "com.modrinth.minotaur" version "2.8.8"
    id 'net.darkhax.curseforgegradle' version '1.1.15'
}


version = mod_version
group = mod_group_id

shadowJar {
    zip64 = true
}

// 创建 sources jar 任务
tasks.register('sourcesJar', Jar) {
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
}

// 将 sources jar 添加到构建工件
artifacts {
    archives sourcesJar
}

// no working
modrinth {
    token = System.getenv("MODRINTH_TOKEN") // Remember to have the MODRINTH_TOKEN environment variable set or else this will fail - just make sure it stays private!
    projectId = "lFj5EvnT" // This can be the project ID or the slug. Either will work!
    versionNumber = "1.1.4-hotfix2" // You don't need to set this manually. Will fail if Modrinth has this version already
    versionType = "release" // This is the default -- can also be `beta` or `alpha`
    uploadFile = jar // With Loom, this MUST be set to `remapJar` instead of `jar`!
//    uploadFile = "build/libs/${mod_id}-${mod_version}.jar" // With Loom, this MUST be set to `remapJar` instead of `jar`!
